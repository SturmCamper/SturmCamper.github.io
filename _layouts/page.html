---
layout: base
---
<article class="post">

    <header class="page-header">
        {% if page.image %}
        <center>
          <img
            src="{{ page.image | relative_url }}"
            alt="{{ page.title }} banner"
            class="rounded-img"
          />
        </center>
        {% endif %}
        <h1 class="page-title">{{ page.title }}</h1>
      </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
